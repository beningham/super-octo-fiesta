<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Now Playing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css">

<style>
  html, body { margin:0; overflow:hidden; height:100%; background:#000; font-family:Inter, system-ui, Arial, sans-serif; }
  body{ display:flex; align-items:center; justify-content:center; width:100%; min-height:100vh; }

  :root{
    --safe-pad-x: clamp(24px, 4.5vw, 80px);
    --safe-pad-y: clamp(20px, 4vh, 64px);
    --accent: #ffd24a;
    --bg-color-deep: #0b1120;
    --bg-color-mid: #1e293b;
    --bg-color-light: #475569;
    --bg-color-pop: #f59e0b;
    --bg-texture: none;
  }

  /* Faceted album backdrop */
  #bg{
    position:fixed; inset:0; z-index:-2; overflow:hidden;
    background: radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--bg-color-pop) 25%, transparent) 0%, transparent 65%),
                radial-gradient(circle at 80% 85%, color-mix(in srgb, var(--bg-color-light) 55%, transparent) 0%, transparent 70%),
                linear-gradient(135deg, var(--bg-color-deep), color-mix(in srgb, var(--bg-color-mid) 70%, black 30%));
  }

  #bg .bg-shape{
    position:absolute; inset:-25%; border-radius:18%;
    transform-origin:center;
    filter: drop-shadow(0 40px 90px rgba(0,0,0,.55));
    pointer-events:none;
  }
  #bg .bg-shape.layer1{
    background: linear-gradient(120deg, color-mix(in srgb, var(--bg-color-mid) 75%, transparent) 0%, color-mix(in srgb, var(--bg-color-pop) 35%, transparent) 95%);
    transform: rotate(7deg) scale(1.05);
    clip-path: polygon(8% 8%, 72% 0%, 100% 54%, 70% 100%, 12% 84%, 0% 32%);
  }
  #bg .bg-shape.layer2{
    background: linear-gradient(210deg, color-mix(in srgb, var(--bg-color-light) 80%, transparent) 0%, color-mix(in srgb, var(--bg-color-deep) 40%, transparent) 100%);
    transform: rotate(-12deg) scale(0.95);
    clip-path: polygon(14% 0%, 88% 10%, 100% 70%, 60% 100%, 0% 86%, 0% 26%);
    mix-blend-mode: screen;
    opacity:.78;
  }
  #bg .bg-shape.layer3{
    background: linear-gradient(165deg, color-mix(in srgb, var(--bg-color-pop) 60%, transparent) 0%, color-mix(in srgb, var(--bg-color-light) 30%, transparent) 85%);
    transform: rotate(18deg) scale(0.75);
    clip-path: polygon(12% 18%, 88% 0%, 100% 58%, 52% 100%, 0% 88%, 0% 36%);
    mix-blend-mode: lighten;
    opacity:.62;
  }

  #bg .bg-texture{
    position:absolute; inset:-18%;
    background-image: var(--bg-texture);
    background-size:cover; background-position:center;
    filter: saturate(1.4) contrast(0.9) blur(55px);
    opacity:.38;
    mix-blend-mode: color;
    pointer-events:none;
  }

  /* Main layout: left text, right art, TV-safe padding */
  #content{
    position:relative; display:grid; grid-template-columns: 1.25fr 1fr;
    align-items:center; height:min(100vh, 720px); width:min(100vw, 1280px);
    padding: var(--safe-pad-y) var(--safe-pad-x);
    color:#fff; box-sizing:border-box;
  }

  /* Text column */
  #info{
    display:flex; flex-direction:column; justify-content:center; gap:.6rem;
    height:75vh; max-width:min(64rem, 58vw); max-height:520px;
    text-shadow: 0 2px 20px rgba(0,0,0,.65), 0 1px 6px rgba(0,0,0,.55);
    transform:translateY(-.5rem);
  }
  #artist{
    margin:0;
    font-weight:800; line-height:1.05; letter-spacing:.02em;
    text-transform:uppercase;
    /* BIG like your screenshot, but responsive for 1080p/4K */
    font-size: clamp(28px, 4.6vmin, 64px);
  }
  #title{
    margin:0;
    font-weight:650; line-height:1.12; opacity:.95;
    font-size: clamp(18px, 2.6vmin, 28px);
    color: var(--accent);
  }

  #funfact{
    font-style:italic; color:#a5b4fc;
    font-size: clamp(14px, 2.0vmin, 22px); line-height:1.55;
    max-width: 90ch;
    min-height: 11rem;
    margin-top:.8rem;
  }

  /* Album art: framed and pushed to the side */
  .artWrap{
    width:100%;
    display:flex; justify-content:flex-end; align-items:center;
    padding-right: clamp(8px, 2vw, 40px);
  }

  #funfact{
    font-style:italic; color:#a5b4fc; opacity:0; transform:translateY(8px);
    transition:opacity 1.1s ease, transform 1s ease;
    font-size: clamp(14px, 2.0vmin, 22px); line-height:1.55;
    max-width: 90ch;
    min-height: 11rem;
    margin-top:.8rem;
  }
  #funfact.active{ opacity:1; transform:translateY(0); }

  /* Album art: framed and pushed to the side */
  .artWrap{
    width:100%;
    display:flex; justify-content:flex-end; align-items:center;
    padding-right: clamp(8px, 2vw, 40px);
  }
  .coverFrame{
    width: min(52vh, 40vw);   /* square that scales with TV height */
    aspect-ratio: 1 / 1;
    position:relative; border-radius:14px; overflow:hidden;
    box-shadow: 0 22px 70px rgba(0,0,0,.60);
    background: #000; /* removed gold gradient & border */
    border: none;     /* no visible border */
  }
  .coverImg{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border-radius:14px;
    opacity:0;
    background:#111;
  }
  .coverImg.visible{ opacity:1; }

  /* Idle / waiting logo (centre, dark) */
  #logoLayer{
    position:fixed; inset:0; display:grid; place-items:center;
    background:#000; opacity:0; pointer-events:none; z-index:20;
    transition:none;
  }
  #logoLayer.show{ opacity:1; }
  #logoLayer img{
    max-width: 48vmin; max-height: 48vmin; object-fit:contain;
    filter: grayscale(1) brightness(0.75);
  }

  #modeIndicator{
    position:fixed; top: clamp(12px, 3vh, 28px); right: clamp(12px, 3vw, 32px);
    z-index:40; padding:0.35rem 0.85rem; border-radius:999px;
    border:1px solid rgba(255,255,255,.35); background:rgba(15,23,42,.65);
    font-size: clamp(12px, 1.9vmin, 15px); letter-spacing:.12em;
    text-transform:uppercase; color:#f8fafc; pointer-events:none;
    backdrop-filter: blur(12px); text-shadow:0 1px 6px rgba(0,0,0,.65);
  }
  #modeIndicator strong{ color:var(--accent); font-weight:700; }
  #modeIndicator[data-design="true"]{ border-color:var(--accent); box-shadow:0 0 12px rgba(255,210,74,.32); }

  @media (max-height: 780px){
    :root{
      --safe-pad-x: clamp(18px, 5vw, 48px);
      --safe-pad-y: clamp(16px, 5vh, 44px);
    }
    #artist{ font-size: clamp(26px, 5.2vmin, 48px); }
    #title{ font-size: clamp(18px, 3.6vmin, 26px); }
    #funfact{ font-size: clamp(14px, 2.8vmin, 19px); min-height:9.5rem; }
    .coverFrame{ width:min(48vh, 46vw); }
  }
</style>
</head>

<body>
  <!-- Background (faceted, colour-matched) -->
  <div id="bg">
    <span class="bg-shape layer1" aria-hidden="true"></span>
    <span class="bg-shape layer2" aria-hidden="true"></span>
    <span class="bg-shape layer3" aria-hidden="true"></span>
    <span class="bg-texture" aria-hidden="true"></span>
  </div>

  <!-- Main layout -->
  <div id="content">
    <div id="info">
      <h1 id="artist"></h1>
      <h2 id="title"></h2>
      <div id="funfact"></div>
    </div>

    <div class="artWrap">
      <div class="coverFrame">
        <img id="albumA" class="coverImg visible" alt="Album A">
        <img id="albumB" class="coverImg" alt="Album B">
      </div>
    </div>
  </div>

  <!-- Idle / Waiting logo layer -->
  <div id="logoLayer" aria-hidden="true">
    <img id="logoImg" src="assets/logo.png" alt="Station Logo" />
  </div>

  <!-- Screen mode indicator -->
  <div id="modeIndicator" role="status" aria-live="polite"></div>

<script>
  /* ---------- Config ---------- */
  const FACT_DISPLAY_MS = 5000;         // 5 s per fun fact
  const FACTS_PER_SONG  = 3;            // facts per track before next song
  const FALLBACK_COVER  = 'assets/logo.png'; // guaranteed present
  const LOGO_PATH       = 'assets/logo.png';
  const LOGO_HOLD_MS    = 3000;         // show logo between cycles
  const SHOW_LOGO_BETWEEN_CYCLES = true;

  /* ---------- State ---------- */
  let index = 0, data = [];
  let factTimer = null, songTimer = null;
  let coverInitialised = false;
  let activeLayer = 'A';

  const DESIGN_WIDTH = 1280;
  const DESIGN_HEIGHT = 720;

  const FALLBACK_PALETTE = {
    deep: '#0b1120',
    mid: '#1e293b',
    light: '#475569',
    pop: '#f59e0b'
  };
  let backdropToken = 0;

  /* ---------- Boot ---------- */
  fetch('songs.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : [])
    .then(json => { data = Array.isArray(json) ? json : []; showSong(); })
    .catch(() => { data = []; showSong(); });

  /* ---------- Utils ---------- */
  const preload = (src) => new Promise(resolve => {
    const stampUrl = (value) => {
      const stamp = Date.now();
      const str = String(value);
      const separator = str.includes('?') ? '&' : '?';
      return `${str}${separator}v=${stamp}`;
    };

    if (!src) {
      const fallbackUrl = stampUrl(FALLBACK_COVER);
      resolve({ ok: false, url: fallbackUrl });
      return;
    }

    const stampedSrc = stampUrl(src);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.decoding = 'async';
    img.onload  = () => resolve({ ok: true, url: stampedSrc });
    img.onerror = () => {
      const fallbackUrl = stampUrl(FALLBACK_COVER);
      const fallbackImg = new Image();
      fallbackImg.onload = () => resolve({ ok: false, url: fallbackUrl });
      fallbackImg.onerror = () => resolve({ ok: false, url: fallbackUrl });
      fallbackImg.src = fallbackUrl;
    };
    img.src = stampedSrc;
  });

  function applyPalette(palette = FALLBACK_PALETTE){
    const { deep, mid, light, pop } = { ...FALLBACK_PALETTE, ...palette };
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--bg-color-deep', deep);
    rootStyle.setProperty('--bg-color-mid', mid);
    rootStyle.setProperty('--bg-color-light', light);
    rootStyle.setProperty('--bg-color-pop', pop);
  }

  function updateBackdrop(imageUrl){
    const token = ++backdropToken;
    const texture = imageUrl ? `url("${imageUrl}")` : 'none';
    document.documentElement.style.setProperty('--bg-texture', texture);
    applyPalette();

    extractPalette(imageUrl).then(palette => {
      if (token !== backdropToken) return;
      if (palette) applyPalette(palette);
    });
  }

  function extractPalette(imageUrl){
    return new Promise(resolve => {
      if (!imageUrl) {
        resolve(null);
        return;
      }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try{
          const canvas = document.createElement('canvas');
          const sampleWidth = 96;
          const ratio = img.height / (img.width || 1);
          const sampleHeight = Math.max(1, Math.round(sampleWidth * ratio));
          canvas.width = sampleWidth;
          canvas.height = sampleHeight;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, sampleWidth, sampleHeight);
          const { data } = ctx.getImageData(0, 0, sampleWidth, sampleHeight);
          if (!data || !data.length) {
            resolve(null);
            return;
          }
          const buckets = new Map();
          for (let i = 0; i < data.length; i += 4){
            const alpha = data[i + 3];
            if (alpha < 220) continue;
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const key = `${Math.round(r / 24)}-${Math.round(g / 24)}-${Math.round(b / 24)}`;
            let bucket = buckets.get(key);
            if (!bucket){
              bucket = { count: 0, r: 0, g: 0, b: 0 };
              buckets.set(key, bucket);
            }
            bucket.count++;
            bucket.r += r;
            bucket.g += g;
            bucket.b += b;
          }
          const colors = Array.from(buckets.values())
            .map(bucket => {
              const r = bucket.r / bucket.count;
              const g = bucket.g / bucket.count;
              const b = bucket.b / bucket.count;
              const { s, l } = rgbToHsl(r, g, b);
              return { r, g, b, s, l, count: bucket.count };
            })
            .sort((a, b) => b.count - a.count)
            .slice(0, 12);

          if (!colors.length) {
            resolve(null);
            return;
          }

          const byLight = [...colors].sort((a, b) => a.l - b.l);
          const deep = byLight[0] || colors[0];
          const bright = byLight[byLight.length - 1] || colors[0];
          const mid = byLight[Math.max(0, Math.min(byLight.length - 1, Math.floor(byLight.length / 2)))] || colors[0];
          const bySaturation = [...colors].sort((a, b) => (b.s - a.s) || (b.count - a.count));
          const vibrant = bySaturation.find(col => col.l > 0.25) || bySaturation[0] || bright;

          resolve({
            deep: colorToCss(deep, FALLBACK_PALETTE.deep),
            mid: colorToCss(mid, FALLBACK_PALETTE.mid),
            light: colorToCss(bright, FALLBACK_PALETTE.light),
            pop: colorToCss(vibrant, FALLBACK_PALETTE.pop)
          });
        } catch (err){
          resolve(null);
        }
      };
      img.onerror = () => resolve(null);
      img.src = imageUrl;
    });
  }

  function colorToCss(entry, fallback){
    if (!entry) return fallback;
    const clamp = (value) => Math.max(0, Math.min(255, Math.round(value)));
    const r = clamp(entry.r);
    const g = clamp(entry.g);
    const b = clamp(entry.b);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function rgbToHsl(r, g, b){
    r /= 255;
    g /= 255;
    b /= 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    let s = 0;
    const l = (max + min) / 2;

    if (max !== min){
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    }

    return { s, l };
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  /* ---------- Cover swap ---------- */
  function swapCoverInstant(newUrl) {
    const a = document.getElementById('albumA');
    const b = document.getElementById('albumB');
    const current  = activeLayer === 'A' ? a : b;
    const incoming = activeLayer === 'A' ? b : a;

    incoming.src = newUrl;
    incoming.classList.add('visible');
    current.classList.remove('visible');
    activeLayer = (incoming === a) ? 'A' : 'B';
  }

  /* ---------- Idle / Logo ---------- */
  async function showLogoHold() {
    const logoLayer = document.getElementById('logoLayer');
    const logo = document.getElementById('logoImg');
    const fun = document.getElementById('funfact');

    if (fun) fun.toggleAttribute('hidden', true);

    logo.src = `${LOGO_PATH}?v=${Date.now()}`;
    logoLayer.classList.add('show');
    logoLayer.setAttribute('aria-hidden', 'false');

    await sleep(LOGO_HOLD_MS);

    logoLayer.classList.remove('show');
    logoLayer.setAttribute('aria-hidden', 'true');
  }
  window.showIdleLogo = async () => { await showLogoHold(); };

  /* ---------- Screen mode indicator ---------- */
  function reduceRatio(width, height){
    const gcd = (a,b) => b ? gcd(b, a % b) : a;
    const divisor = gcd(width, height) || 1;
    return `${Math.round(width / divisor)}:${Math.round(height / divisor)}`;
  }

  function describeMode(width, height){
    const steps = [
      { label: '4K', height: 2160 },
      { label: '1440p', height: 1440 },
      { label: '1080p', height: 1080 },
      { label: '720p', height: 720 },
      { label: 'SD', height: 0 }
    ];
    const match = steps.find(step => height >= step.height) || steps[steps.length - 1];
    const aspect = reduceRatio(width, height);
    const isSixteenNine = Math.abs(width / height - 16 / 9) < 0.02;
    return {
      label: match.label,
      aspect: isSixteenNine ? '16:9' : aspect,
      isDesign: width === DESIGN_WIDTH && height === DESIGN_HEIGHT
    };
  }

  function updateScreenMode(){
    const indicator = document.getElementById('modeIndicator');
    if (!indicator) return;
    const width = Math.round(window.innerWidth);
    const height = Math.round(window.innerHeight);
    const { label, aspect, isDesign } = describeMode(width, height);
    indicator.dataset.design = isDesign ? 'true' : 'false';
    indicator.innerHTML = `<strong>${label}</strong> · ${width}×${height} · ${aspect}`;
  }

  window.addEventListener('resize', updateScreenMode);
  window.addEventListener('orientationchange', updateScreenMode);
  updateScreenMode();

  /* ---------- Main flow ---------- */
  async function showSong() {
    const fun  = document.getElementById('funfact');
    const artist = document.getElementById('artist');
    const title  = document.getElementById('title');
    const logoLayer = document.getElementById('logoLayer');

    clearInterval(factTimer);
    factTimer = null;
    clearTimeout(songTimer);
    songTimer = null;

    if (logoLayer) {
      logoLayer.classList.remove('show');
      logoLayer.setAttribute('aria-hidden', 'true');
    }

    const song = data[index];
    if (!song) {
      await showLogoHold();
      return;
    }

    const coverImg = await preload(song.image);

    artist.textContent = String(song.artist || '').toUpperCase();
    title.textContent  = [song.title || '', song.year ? `(${song.year})` : ''].filter(Boolean).join(' ');

    updateBackdrop(coverImg.url);

    if (!coverInitialised) {
      const a = document.getElementById('albumA');
      a.src = coverImg.url;
      a.classList.add('visible');
      activeLayer = 'A';
      coverInitialised = true;
    } else {
      swapCoverInstant(coverImg.url);
    }

    const factsArr = Array.isArray(song.funfacts) && song.funfacts.length ? song.funfacts : [''];
    let factIndex = 0;
    const updateFact = () => {
      if (!fun) return;
      const nextFact = factsArr[factIndex] || '';
      fun.textContent = nextFact;
      fun.toggleAttribute('hidden', !nextFact.trim());
    };
    updateFact();

    if (factsArr.length > 1) {
      factTimer = setInterval(() => {
        factIndex = (factIndex + 1) % factsArr.length;
        updateFact();
      }, FACT_DISPLAY_MS);
    }

    const cycles = Math.max(1, Math.min(FACTS_PER_SONG, factsArr.length || 1));
    songTimer = setTimeout(async () => {
      if (factTimer) {
        clearInterval(factTimer);
        factTimer = null;
      }

      const endOfCycle = (index === data.length - 1);
      if (endOfCycle && SHOW_LOGO_BETWEEN_CYCLES) {
        await showLogoHold();
        index = 0;
        showSong();
      } else {
        nextSong();
      }
    }, FACT_DISPLAY_MS * cycles);
  }

  function nextSong() {
    if (!data.length) return;
    index = (index + 1) % data.length;
    showSong();
  }
</script>

</body>
</html>
