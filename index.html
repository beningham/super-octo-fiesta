<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Now Playing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css">

<style>
  html, body { margin:0; overflow:hidden; height:100%; background:#000; font-family:Inter, system-ui, Arial, sans-serif; }

  :root{
    --safe-pad-x: clamp(24px, 4.5vw, 80px);
    --safe-pad-y: clamp(20px, 4vh, 64px);
    --accent: #ffd24a;
  }

  /* Blurred album background with stronger darkening */
  #bg{
    position:fixed; inset:0; width:110%; height:110%;
    background-size:cover; background-position:center;
    filter:blur(60px) brightness(0.22) saturate(0.9);
    transform-origin:center;
    animation:kenburns 40s ease-in-out infinite alternate;
    transition:background-image 1.2s ease-in-out, filter .4s ease-in-out;
    z-index:-2;
  }
  @keyframes kenburns{
    0%{ transform:scale(1) translate(0%,0%); }
    100%{ transform:scale(1.18) translate(-2%,-3%); }
  }

  /* Subtle depth overlay */
  #bg::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.05), rgba(0,0,0,.85) 68%);
    mix-blend-mode:soft-light;
  }

  /* Fade-to-black between songs */
  #fadeOverlay{ position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:10; transition:opacity 1s ease; }
  #fadeOverlay.active{ opacity:1; }

  /* Main layout: left text, right art, TV-safe padding */
  #content{
    position:relative; display:grid; grid-template-columns: 1.25fr 1fr;
    align-items:center; height:100vh; width:100vw;
    padding: var(--safe-pad-y) var(--safe-pad-x);
    color:#fff;
  }

  /* Text column */
  #info{
    display:flex; flex-direction:column; justify-content:center; gap:.6rem;
    height:75vh; max-width:min(64rem, 58vw);
    text-shadow: 0 2px 20px rgba(0,0,0,.65), 0 1px 6px rgba(0,0,0,.55);
    transform:translateY(-.5rem);
  }
  #artist{
    margin:0;
    font-weight:800; line-height:1.05; letter-spacing:.02em;
    text-transform:uppercase;
    /* BIG like your screenshot, but responsive for 1080p/4K */
    font-size: clamp(28px, 4.6vmin, 64px);
  }
  #title{
    margin:0;
    font-weight:650; line-height:1.12; opacity:.95;
    font-size: clamp(18px, 2.6vmin, 28px);
  }

  #funfact{
    font-style:italic; color:#a5b4fc; opacity:0; transform:translateY(8px);
    transition:opacity 1.1s ease, transform 1s ease;
    font-size: clamp(14px, 2.0vmin, 22px); line-height:1.55;
    max-width: 90ch;
    min-height: 11rem;
    margin-top:.8rem;
  }
  #funfact.active{ opacity:1; transform:translateY(0); }

  /* Album art: framed and pushed to the side */
  .artWrap{
    width:100%;
    display:flex; justify-content:flex-end; align-items:center;
    padding-right: clamp(8px, 2vw, 40px);
  }
  .coverFrame{
    width: min(64vh, 42vw);   /* square that scales with TV height */
    aspect-ratio: 1 / 1;
    position:relative; border-radius:14px; overflow:hidden;
    box-shadow: 0 22px 70px rgba(0,0,0,.60);
    background: #000; /* removed gold gradient & border */
    border: none;     /* no visible border */
  }
  .coverImg{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border-radius:14px;
    opacity:0; transition:opacity 600ms ease;
    background:#111;
  }
  .coverImg.visible{ opacity:1; }

  /* Idle / waiting logo (centre, dark) */
  #logoLayer{
    position:fixed; inset:0; display:grid; place-items:center;
    background:#000; opacity:0; pointer-events:none; z-index:20;
    transition:opacity 700ms ease;
  }
  #logoLayer.show{ opacity:1; }
  #logoLayer img{
    max-width: 48vmin; max-height: 48vmin; object-fit:contain;
    filter: grayscale(1) brightness(0.75);
  }
</style>
</head>

<body>
  <!-- Background (album art, blurred + dark) -->
  <div id="bg"></div>

  <!-- Cinematic fade overlay -->
  <div id="fadeOverlay"></div>

  <!-- Main layout -->
  <div id="content">
    <div id="info">
      <h1 id="artist"></h1>
      <h2 id="title"></h2>
      <div id="funfact"></div>
    </div>

    <div class="artWrap">
      <div class="coverFrame">
        <img id="albumA" class="coverImg visible" alt="Album A">
        <img id="albumB" class="coverImg" alt="Album B">
      </div>
    </div>
  </div>

  <!-- Idle / Waiting logo layer -->
  <div id="logoLayer" aria-hidden="true">
    <img id="logoImg" src="assets/logo.png" alt="Station Logo" />
  </div>

<script>
  /* ---------- Config ---------- */
  const FACT_DISPLAY_MS = 5000;         // 5 s per fun fact
  const FACTS_PER_SONG  = 3;            // facts per track before next song
  const FALLBACK_COVER  = 'assets/logo.png'; // guaranteed present
  const LOGO_PATH       = 'assets/logo.png';
  const LOGO_HOLD_MS    = 3000;         // show logo between cycles
  const SHOW_LOGO_BETWEEN_CYCLES = true;

  /* ---------- State ---------- */
  let index = 0, data = [];
  let factTimer = null, songTimer = null;
  let coverInitialised = false;
  let activeLayer = 'A';

  /* ---------- Boot ---------- */
  fetch('songs.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : [])
    .then(json => { data = Array.isArray(json) ? json : []; showSong(true); })
    .catch(() => { data = []; showSong(true); });

  /* ---------- Utils ---------- */
  const preload = (src) => new Promise(resolve => {
    const url = `${src}?v=${Date.now()}`;     // cache-bust
    const img = new Image();
    img.onload  = () => resolve({ ok: true,  url });
    img.onerror = () => resolve({ ok: false, url: `${FALLBACK_COVER}?v=${Date.now()}` });
    img.src = url;
  });

  const setBackground = (url) => {
    document.getElementById('bg').style.backgroundImage = `url('${url}?v=${Date.now()}')`;
  };

  function showBlack(on) {
    const fade = document.getElementById('fadeOverlay');
    fade.classList.toggle('active', !!on);
  }

  /* ---------- Cover swap (under black) ---------- */
  function swapCoverInstant(newUrl) {
    const a = document.getElementById('albumA');
    const b = document.getElementById('albumB');
    const current  = activeLayer === 'A' ? a : b;
    const incoming = activeLayer === 'A' ? b : a;

    incoming.src = newUrl;                // prime new bitmap
    incoming.classList.add('visible');    // show new
    current.classList.remove('visible');  // hide old immediately
    activeLayer = (incoming === a) ? 'A' : 'B';
  }

  /* ---------- Idle / Logo ---------- */
  async function showLogoHold() {
    const logoLayer = document.getElementById('logoLayer');
    const logo = document.getElementById('logoImg');
    logo.src = `${LOGO_PATH}?v=${Date.now()}`;

    showBlack(true);
    await sleep(250);

    document.getElementById('funfact').classList.remove('active');
    logoLayer.classList.add('show');
    logoLayer.setAttribute('aria-hidden', 'false');

    await sleep(120);
    showBlack(false);

    await sleep(LOGO_HOLD_MS);

    showBlack(true);
    await sleep(400);
    logoLayer.classList.remove('show');
    logoLayer.setAttribute('aria-hidden', 'true');
  }
  // Expose for “no music playing” events
  window.showIdleLogo = async () => { await showLogoHold(); };

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  /* ---------- Main flow ---------- */
  async function showSong(isFirst = false) {
    const fade = document.getElementById('fadeOverlay');
    const fun  = document.getElementById('funfact');
    const artist = document.getElementById('artist');
    const title  = document.getElementById('title');

    clearInterval(factTimer);
    clearTimeout(songTimer);

    const song = data[index];
    if (!song) {
      // No data → idle logo
      await showLogoHold();
      return;
    }

    // On subsequent tracks, hold black first to avoid any flash
    if (!isFirst) fade.classList.add('active');

    // Preload both assets in parallel while black is up (or during first run)
    const [bgImg, coverImg] = await Promise.all([preload(song.image), preload(song.image)]);

    // Apply text while black (cheap + safe)
    artist.textContent = String(song.artist || '').toUpperCase();
    title.textContent  = [song.title || '', song.year ? `(${song.year})` : ''].filter(Boolean).join(' ');

    // Apply visuals under black — no crossfade needed because black handles it
    setBackground(bgImg.url);

    if (!coverInitialised) {
      // first frame: seed albumA
      const a = document.getElementById('albumA');
      a.src = coverImg.url;
      a.classList.add('visible');
      activeLayer = 'A';
      coverInitialised = true;
    } else {
      // subsequent frames: hard swap under black, then lift
      swapCoverInstant(coverImg.url);
    }

    // Lift black after everything is in its final state
    setTimeout(() => fade.classList.remove('active'), isFirst ? 0 : 120);

    // Facts: show first immediately, then rotate
    const factsArr = Array.isArray(song.funfacts) && song.funfacts.length ? song.funfacts : [''];
    let factIndex = 0;
    fun.textContent = factsArr[factIndex] || '';
    fun.classList.add('active');

    factTimer = setInterval(() => {
      fun.classList.remove('active');
      setTimeout(() => {
        factIndex = (factIndex + 1) % factsArr.length;
        fun.textContent = factsArr[factIndex] || '';
        fun.classList.add('active');
      }, 700);
    }, FACT_DISPLAY_MS);

    // After N facts, either show logo (end of cycle) or advance
    songTimer = setTimeout(async () => {
      clearInterval(factTimer);

      const endOfCycle = (index === data.length - 1);
      if (endOfCycle && SHOW_LOGO_BETWEEN_CYCLES) {
        await showLogoHold();
        index = 0;               // restart from first track
        showSong();              // resume rotation
      } else {
        // brief black before next
        fade.classList.add('active');
        setTimeout(nextSong, 900);
      }
    }, FACT_DISPLAY_MS * Math.max(1, Math.min(FACTS_PER_SONG, factsArr.length || 1)));
  }

  function nextSong() {
    index = (index + 1) % data.length;
    showSong();
  }
</script>

</body>
</html>
