<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Now Playing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css">

<style>
  html, body { margin:0; overflow:hidden; height:100%; background:#000; font-family:Inter, system-ui, Arial, sans-serif; }
  body{ display:flex; align-items:center; justify-content:center; width:100%; min-height:100vh; }

  :root{
    --safe-pad-x: clamp(24px, 4.5vw, 80px);
    --safe-pad-y: clamp(20px, 4vh, 64px);
    --accent: #ffd24a;
    --bg-color-deep: #0b1120;
    --bg-color-mid: #1e293b;
    --bg-color-light: #475569;
    --bg-color-pop: #f59e0b;
    --bg-texture: none;
  }

  /* Faceted album backdrop */
  #bg{
    position:fixed; inset:0; z-index:-2; overflow:hidden;
    background: radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--bg-color-pop) 25%, transparent) 0%, transparent 65%),
                radial-gradient(circle at 80% 85%, color-mix(in srgb, var(--bg-color-light) 55%, transparent) 0%, transparent 70%),
                linear-gradient(135deg, var(--bg-color-deep), color-mix(in srgb, var(--bg-color-mid) 70%, black 30%));
  }

  #bg .bg-shape{
    position:absolute; inset:-25%; border-radius:18%;
    transform-origin:center;
    filter: drop-shadow(0 40px 90px rgba(0,0,0,.55));
    pointer-events:none;
  }
  #bg .bg-shape.layer1{
    background: linear-gradient(120deg, color-mix(in srgb, var(--bg-color-mid) 75%, transparent) 0%, color-mix(in srgb, var(--bg-color-pop) 35%, transparent) 95%);
    transform: rotate(7deg) scale(1.05);
    clip-path: polygon(8% 8%, 72% 0%, 100% 54%, 70% 100%, 12% 84%, 0% 32%);
  }
  #bg .bg-shape.layer2{
    background: linear-gradient(210deg, color-mix(in srgb, var(--bg-color-light) 80%, transparent) 0%, color-mix(in srgb, var(--bg-color-deep) 40%, transparent) 100%);
    transform: rotate(-12deg) scale(0.95);
    clip-path: polygon(14% 0%, 88% 10%, 100% 70%, 60% 100%, 0% 86%, 0% 26%);
    mix-blend-mode: screen;
    opacity:.78;
  }
  #bg .bg-shape.layer3{
    background: linear-gradient(165deg, color-mix(in srgb, var(--bg-color-pop) 60%, transparent) 0%, color-mix(in srgb, var(--bg-color-light) 30%, transparent) 85%);
    transform: rotate(18deg) scale(0.75);
    clip-path: polygon(12% 18%, 88% 0%, 100% 58%, 52% 100%, 0% 88%, 0% 36%);
    mix-blend-mode: lighten;
    opacity:.62;
  }

  #bg .bg-texture{
    position:absolute; inset:-18%;
    background-image: var(--bg-texture);
    background-size:cover; background-position:center;
    filter: saturate(1.4) contrast(0.9) blur(55px);
    opacity:.38;
    mix-blend-mode: color;
    pointer-events:none;
  }

  /* Main layout: left text, right art, TV-safe padding */
  #content{
    position:relative; display:grid; grid-template-columns: 1.25fr 1fr;
    align-items:center; height:min(100vh, 720px); width:min(100vw, 1280px);
    padding: var(--safe-pad-y) var(--safe-pad-x);
    color:#fff; box-sizing:border-box;
  }

  /* Text column */
  #info{
    display:flex; flex-direction:column; justify-content:center; gap:.6rem;
    height:75vh; max-width:min(64rem, 58vw); max-height:520px;
    text-shadow: 0 2px 20px rgba(0,0,0,.65), 0 1px 6px rgba(0,0,0,.55);
    transform:translateY(-.5rem);
  }
  #artist{
    margin:0;
    font-weight:800; line-height:1.05; letter-spacing:.02em;
    text-transform:uppercase;
    /* BIG like your screenshot, but responsive for 1080p/4K */
    font-size: clamp(28px, 4.6vmin, 64px);
  }
  #title{
    margin:0;
    font-weight:650; line-height:1.12; opacity:.95;
    font-size: clamp(18px, 2.6vmin, 28px);
    color: var(--accent);
  }

  #funfact{
    font-style:italic; color:#a5b4fc;
    font-size: clamp(14px, 2.0vmin, 22px); line-height:1.55;
    max-width: 90ch;
    min-height: 11rem;
    margin-top:.8rem;
  }

  /* Album art: framed and pushed to the side */
  .artWrap{
    width:100%;
    display:flex; justify-content:flex-end; align-items:center;
    padding-right: clamp(8px, 2vw, 40px);
  }
  .coverFrame{
    width: min(52vh, 40vw);   /* square that scales with TV height */
    aspect-ratio: 1 / 1;
    position:relative; border-radius:14px; overflow:hidden;
    box-shadow: 0 22px 70px rgba(0,0,0,.60);
    background: #000; /* removed gold gradient & border */
    border: none;     /* no visible border */
  }
  .coverImg{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border-radius:14px;
    opacity:0;
    background:#111;
  }
  .coverImg.visible{ opacity:1; }

  /* Idle / waiting logo (centre, dark) */
  #logoLayer{
    position:fixed; inset:0; display:grid; place-items:center;
    background:#000; opacity:0; pointer-events:none; z-index:20;
    transition:none;
  }
  #logoLayer.show{ opacity:1; }
  #logoLayer img{
    max-width: 48vmin; max-height: 48vmin; object-fit:contain;
    filter: grayscale(1) brightness(0.75);
  }

  #modeIndicator{
    position:fixed; top: clamp(12px, 3vh, 28px); right: clamp(12px, 3vw, 32px);
    z-index:40; padding:0.35rem 0.85rem; border-radius:999px;
    border:1px solid rgba(255,255,255,.35); background:rgba(15,23,42,.65);
    font-size: clamp(12px, 1.9vmin, 15px); letter-spacing:.12em;
    text-transform:uppercase; color:#f8fafc; pointer-events:none;
    backdrop-filter: blur(12px); text-shadow:0 1px 6px rgba(0,0,0,.65);
  }
  #modeIndicator strong{ color:var(--accent); font-weight:700; }
  #modeIndicator[data-design="true"]{ border-color:var(--accent); box-shadow:0 0 12px rgba(255,210,74,.32); }

  @media (max-height: 780px){
    :root{
      --safe-pad-x: clamp(18px, 5vw, 48px);
      --safe-pad-y: clamp(16px, 5vh, 44px);
    }
    #artist{ font-size: clamp(26px, 5.2vmin, 48px); }
    #title{ font-size: clamp(18px, 3.6vmin, 26px); }
    #funfact{ font-size: clamp(14px, 2.8vmin, 19px); min-height:9.5rem; }
    .coverFrame{ width:min(48vh, 46vw); }
  }
</style>
</head>

<body>
  <!-- Background (faceted, colour-matched) -->
  <div id="bg">
    <span class="bg-shape layer1" aria-hidden="true"></span>
    <span class="bg-shape layer2" aria-hidden="true"></span>
    <span class="bg-shape layer3" aria-hidden="true"></span>
    <span class="bg-texture" aria-hidden="true"></span>
  </div>

  <!-- Main layout -->
  <div id="content">
    <div id="info">
      <h1 id="artist"></h1>
      <h2 id="title"></h2>
      <div id="funfact"></div>
    </div>

    <div class="artWrap">
      <div class="coverFrame">
        <img id="albumA" class="coverImg visible" alt="Album A">
        <img id="albumB" class="coverImg" alt="Album B">
      </div>
    </div>
  </div>

  <!-- Idle / Waiting logo layer -->
  <div id="logoLayer" aria-hidden="true">
    <img id="logoImg" src="assets/logo.png" alt="Station Logo" />
  </div>

  <!-- Screen mode indicator -->
  <div id="modeIndicator" role="status" aria-live="polite"></div>

<script src="app.js"></script>

</body>
</html>
